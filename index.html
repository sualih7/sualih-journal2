<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sualih Journal</title>
  <style>
    :root{--bg:#0a0a0f;--card:#131318;--c:#00d4ff;--t:#e0e0e0;--m:#888;--w:#04c49c;--l:#ff4757;--g:#1f1f24}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    h1{font-size:2rem;margin-bottom:10px;background:linear-gradient(90deg,var(--c),#4a4aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .grid{display:grid;gap:20px}
    .card{background:var(--card);border-radius:12px;padding:20px;transition:transform .2s}
    .card:hover{transform:translateY(-4px)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;text-align:center}
    .val{color:var(--c);font-size:1.4rem;font-weight:bold}
    .lbl{color:var(--m);font-size:.8rem}
    .tbl{border-collapse:collapse;width:100%;font-size:.8rem}
    .tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--g)}
    .tbl th{background:var(--g);color:var(--c)}
    .dz{border:2px dashed var(--c);border-radius:12px;padding:40px;text-align:center;color:var(--m);cursor:pointer;transition:.3s}
    .dz.drag{border-color:var(--c);background:rgba(0,212,255,.1)}
    .dz input{display:none}
    .badge{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:bold}
    .win{background:rgba(4,196,156,.15);color:var(--w)}
    .loss{background:rgba(255,71,87,.15);color:var(--l)}
  </style>
</head>
<body>
  <div class="container">
    <h1>🪙 Sualih Journal</h1>
    <p>Gold / XAUUSD Trade Tracker</p>
    <div class="stats">
      <div class="stat"><div id="bal" class="val">$200.00</div><div class="lbl">Balance</div></div>
      <div class="stat"><div id="pl" class="val">+$0.00</div><div class="lbl">P&L</div></div>
      <div class="stat"><div id="wr" class="val">0%</div><div class="lbl">Win Rate</div></div>
      <div class="stat"><div id="pf" class="val">0.0x</div><div class="lbl">Profit Factor</div></div>
      <div class="stat"><div id="tc" class="val">0</div><div class="lbl">Trades</div></div>
    </div>
    <div style="margin-top:20px;display:grid;gap:16px">
      <div class="card"><h2>📁 Import MT5 CSV</h2><div class="dz" id="dz"><div>📂 Drag CSV here or click</div><input type="file" id="fl"></div><p style="font-size:.8rem;color:var(--m);margin-top:8px">Columns: date, symbol, Buy/Sell, entry, SL, TP, size, profit</p></div>
      <div class="card"><h2>📊 Equity Curve</h2><div id="eq" style="height:150px;display:flex;align-items:flex-end;gap:4px"></div></div>
    </div>
    <div class="card" style="margin-top:24px">
      <h2>📋 Trades</h2>
      <table class="tbl"><thead><tr><th>Date</th><th>Symbol</th><th>Dir</th><th>Entry</th><th>SL</th><th>TP</th><th>Size</th><th>P&L</th><th>RR</th></tr></thead><tbody id="tb"></tbody></table>
    </div>
  </div>
  <script>
    const BAL=200;let trades=JSON.parse(localStorage.sualih||'[]');
    function r(t){return new Date(t).toLocaleString()}
    function rr(o,s,t){const r=o-s,p=t-o;return r?+(p/r).toFixed(2):0}
    function render(){
      let pnl=0,w=0,l=0,rat=0,cum=[BAL];
      trades.forEach(t=>{pnl+=t.profit;cum.push(cum[cum.length-1]+t.profit);if(t.profit>0)w++;else if(t.profit<0)l++;rat+=rr(t.open_price,t.stop_loss,t.take_profit)});
      document.getElementById('bal').textContent='$'+(BAL+pnl).toFixed(2);
      document.getElementById('pl').textContent=(pnl>=0?'+':'')+pnl.toFixed(2);
      document.getElementById('tc').textContent=trades.length;
      document.getElementById('wr').textContent=trades.length?Math.round(w/trades.length*100)+'%':'0%';
      document.getElementById('pf').textContent=l?Math.round(w/l*100)/10+'x':'∞';
      document.getElementById('eq').innerHTML=cum.map((v,i)=>{const h=Math.abs(v)/Math.max(...cum.map(Math.abs),1)*120+20;const c=v>=BAL?'var(--w)':'var(--l)';return'<div style="height:'+h+'px;width:100%;background:'+c+'"></div>'}).join('');
      document.getElementById('tb').innerHTML=trades.map(t=>{
        const dir=t.direction===1?'Buy':'Sell';
        return '<tr><td>'+r(t.time)+'</td><td>'+(t.symbol||'XAUUSD')+'</td><td>'+dir+'</td><td>'+t.open_price+'</td><td>'+t.stop_loss+'</td><td>'+t.take_profit+'</td><td>'+t.size+'</td><td class="'+(t.profit>=0?'win':'loss')+'">'+t.profit.toFixed(2)+'</td><td>'+rr(t.open_price,t.stop_loss,t.take_profit)+'x</td></tr>';
      }).reverse().join('');
    }
    document.getElementById('dz').addEventListener('click',()=>document.getElementById('fl').click());
    document.getElementById('dz').addEventListener('dragover',e=>{e.preventDefault();document.getElementById('dz').classList.add('drag')});
    document.getElementById('dz').addEventListener('dragleave',()=>document.getElementById('dz').classList.remove('drag'));
    document.getElementById('dz').addEventListener('drop',e=>{e.preventDefault();document.getElementById('dz').classList.remove('drag');handle(e.dataTransfer.files[0])});
    document.getElementById('fl').addEventListener('change',e=>{if(e.target.files[0])handle(e.target.files[0])});
    function handle(f){
      const r=new FileReader();
      r.onload=e=>{
        const lines=e.target.result.trim().split('\n');
        lines.slice(1).forEach(l=>{const p=l.split(',');trades.push({time:Date.parse(p[0].replace(/\//g,'-')),symbol:p[1],direction:p[2]==='Buy'?1:-1,open_price:+p[3],stop_loss:+p[4],take_profit:+p[5],size:+p[6],profit:+p[7]||0})});
        trades=trades.slice(-500);localStorage.sualih=JSON.stringify(trades);render()
      };
      r.readAsText(f)
    }
    render()
  </script>
</body>
</html>
